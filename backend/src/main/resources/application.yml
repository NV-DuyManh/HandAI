spring:
  application:
    name: mathvision-business-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mathvision}
    username: ${DB_USERNAME:mathvision}
    password: ${DB_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8082}
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  jwt:
    secret: ${JWT_SECRET:super_secret_development_jwt_key_do_not_use_in_production_1234567890}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  storage:
    upload-root: ${UPLOAD_ROOT:.data/uploads/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8083,http://127.0.0.1:3000,http://127.0.0.1:5172,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8081,http://127.0.0.1:8083}
  ocr:
    pilot:
      collection-mode: ${OCR_PILOT_COLLECTION_MODE:TEST}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET:mathvision}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

ai:
  gateway:
    mode: ${AI_GATEWAY_MODE:FASTAPI}
    url: ${AI_SERVICE_URL:http://localhost:8001/internal/v1/jobs}
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
  callback:
    api-key: ${INTERNAL_API_KEY:secret-key-default}
