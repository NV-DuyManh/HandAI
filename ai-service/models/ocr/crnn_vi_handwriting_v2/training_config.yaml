# MathVision Kids — Handwriting OCR Model V2 Training Configuration Specification
# Version: 2.0.0-PROD.FINAL
# Status: SPECIFICATION_FROZEN (Ready for AI/ML Training Execution once dataset is delivered)

seed: 42
deterministic: true

architecture:
  name: "CRNN-BiLSTM-Enhanced"
  backbone: "CNN-4Block-GroupNorm"
  input_channels: 3
  conv_channels: [64, 128, 256, 512]
  group_norm_groups: 8
  recurrent:
    type: "LSTM"
    input_size: 4096
    hidden_size: 256
    num_layers: 2
    bidirectional: true
    dropout: 0.2
  linear_projection:
    input_size: 512
    num_classes: 320
  ctc_blank_index: 0

data:
  input_tensor_shape: [3, 64, 1024]
  preprocessing_version: "OCR_PREPROC_V2_1"
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  resize_mode: "aspect_preserving_right_pad"
  pad_value: 255
  unicode_composition: "NFC"

training:
  batch_size: 32
  num_workers: 4
  epochs: 100
  early_stopping:
    patience: 15
    metric: "dev_cer"
    mode: "min"
    min_delta: 0.001
  optimizer:
    name: "AdamW"
    lr: 0.0003
    weight_decay: 0.0001
    betas: [0.9, 0.999]
  scheduler:
    name: "CosineAnnealingWarmRestarts"
    T_0: 10
    T_mult: 2
    eta_min: 0.000005
  loss:
    name: "CTCLoss"
    blank: 0
    zero_infinity: true
    reduction: "mean"
    focal_weight: 0.25 # Penalizes high-confidence premature character emissions

augmentation:
  enabled: true
  general_only: true # Explicitly prohibits phrase-specific memorization
  policies:
    rotation_range: [-3.0, 3.0] # degrees
    shear_range: [-0.05, 0.05]
    scale_range: [0.95, 1.05]
    perspective_distortion_scale: 0.05
    gaussian_blur:
      prob: 0.3
      kernel_size: 3
      sigma: [0.1, 1.2]
    stroke_dilation_erosion:
      prob: 0.25
      kernel_size: 2
    diacritic_vertical_jitter:
      prob: 0.2
      max_pixel_drift: 3
    brightness_contrast:
      brightness_factor: [0.8, 1.2]
      contrast_factor: [0.8, 1.2]
    noise:
      prob: 0.2
      gaussian_std: 0.02
    grid_ruling_compositing:
      prob: 0.3
      ruling_opacity: [0.1, 0.4]

splits:
  governance_manifest: "report/HANDWRITING_MODEL_V2_DATASET_MANIFEST.json"
  train_split: "TRAIN"
  dev_split: "DEV"
  holdout_split: "INDEPENDENT_HOLDOUT_V2"
  regression_benchmark: "REGRESSION_33"
  split_strategy: "writer_disjoint"
  leakage_guard: "STRICT_FORBIDDEN"

checkpoint_selection:
  rule: "Select checkpoint with lowest CER on DEV split only"
  prohibited_selection_sets:
    - "REGRESSION_33"
    - "INDEPENDENT_HOLDOUT_V2"
