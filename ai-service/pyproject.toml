[project]
name = "ai-service"
version = "0.1.0"
description = "FastAPI AI Runtime Foundation for MathVision Kids"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "celery>=5.4.0",
    "redis>=5.0.7",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0"
]
