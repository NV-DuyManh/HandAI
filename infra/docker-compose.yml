version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: handai-postgres
    environment:
      POSTGRES_USER: mathvision
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mathvision
    ports:
      - "5432:5432"
    volumes:
      - handai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathvision -d mathvision"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: handai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - handai_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: handai-redis
    ports:
      - "6379:6379"
    volumes:
      - handai_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  handai_pgdata:
  handai_miniodata:
  handai_redisdata:
